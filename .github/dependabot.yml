version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "dotnet-ef"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      testing:
        patterns: ["xunit*", "Swashbuckle.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
