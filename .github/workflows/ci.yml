name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, verify and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore packages and tools
        run: |
          dotnet restore ServiceScheduler.slnx
          dotnet tool restore

      - name: Check formatting
        run: dotnet format ServiceScheduler.slnx --verify-no-changes --no-restore

      # Warnings are errors, which includes NuGet vulnerability audit findings (NU1901-NU1904).
      - name: Build
        run: dotnet build ServiceScheduler.slnx --configuration Release --no-restore

      - name: Check the EF Core model matches the committed migrations
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/ServiceScheduler.Infrastructure
          --startup-project src/ServiceScheduler.Api
          --configuration Release --no-build

      - name: Test
        run: >
          dotnet test --solution ServiceScheduler.slnx --configuration Release --no-build
          --results-directory TestResults
          -- --report-xunit-trx --coverage --coverage-output-format cobertura

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

  smoke-test:
    name: Run the API and smoke test it
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Start the API and run the smoke test
        run: |
          dotnet run --project src/ServiceScheduler.Api --launch-profile http > api.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -fs http://localhost:5080/health/ready > /dev/null && break
            sleep 1
          done
          ./scripts/smoke-test.sh

      - name: Show API log
        if: always()
        run: cat api.log
